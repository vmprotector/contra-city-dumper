name: Build and release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure CMake is available
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            $env:Path += ';C:\Program Files\CMake\bin'
          }
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build\Release\ContraCityDumper.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected build output was not produced: $exe"
          }

          $version = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:GITHUB_SHA.Substring(0, 7)
          }
          $version = $version -replace '[^0-9A-Za-z._-]', '-'

          $stage = Join-Path $PWD "package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe $stage
          Copy-Item "build\Release\*.dll" $stage -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" $stage
          Copy-Item "README.md" $stage

          $zip = "ContraCityDumper-windows-x64-$version.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContraCityDumper-windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
